dependencies:
  bblanchon/arduinojson:
    version: "^7.1.0"
  espressif/esp_tinyusb:
    version: "^2.0.1~1"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
  # TFLite Micro: runtime do wake word "Hi Celer" (microWakeWord V2, modelo
  # proprio int8 embutido no firmware). So entra no build quando a placa liga
  # CELEROS_WAKE_WORD (hoje o cao) — sem a regra de sdkconfig, todas as
  # boards pagariam o componente no flash.
  espressif/esp-tflite-micro:
    version: "^1.4.1"
    rules:
      - if: "target in [esp32s3]"
        when:
          - if: "sdkconfig in [CELEROS_WAKE_WORD]"
